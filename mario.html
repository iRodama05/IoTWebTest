<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mario Power-Ups</title>
    <link rel="stylesheet" href="stylem.css">
</head>
<body>

    <h1>Mario Bros. Power-Ups</h1>

    <div class="personaje-container">
        <img id="personaje" src="img/mario-base.png" alt="Mario Base">
    </div>

    <div id="controles">
        <img src="img/item-hongo.png" alt="Hongo" onclick="usarHongo()" class="power-up">
        <img src="img/item-flor.png" alt="Flor de Fuego" onclick="usarFlor()" class="power-up">
        <img src="img/item-estrella.png" alt="Estrella" onclick="usarEstrella()" class="power-up">
        <img src="img/item-hoja.png" alt="Hoja Tanooki" onclick="usarHoja()" class="power-up">
    </div>

    <script src="script.js"></script>
</body>
</html>
